[workspace]
resolver = "2"
members = ["crates/player", "crates/client", "crates/storage", "crates/app"]

[workspace.package]
version = "0.2.28"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
slint = { version = "=1.18.1", features = ["backend-winit", "renderer-femtovg", "unstable-winit-030"] }
slint-build = "=1.18.1"
glow = "0.18"
libloading = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "2.0"
regex = "1.11"
ring = "0.17"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# Keep source locations in backtraces without full type/variable debug data.
# The test profile inherits dev; release keeps its existing settings.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

