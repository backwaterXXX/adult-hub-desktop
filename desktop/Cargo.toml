[workspace]
resolver = "2"
members = ["crates/player", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
slint = { version = "=1.18.1", features = ["backend-winit", "renderer-femtovg"] }
slint-build = "=1.18.1"
glow = "0.16"
libloading = "0.9"
serde_json = "1"
