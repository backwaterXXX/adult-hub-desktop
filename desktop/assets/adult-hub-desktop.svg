<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded rect -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="#e91e63" stroke-width="8" />

  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2a2a34" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Play button symbol -->
  <path d="M 216 168 L 344 256 L 216 344 Z" fill="url(#pinkGrad)" filter="url(#glow)" />
</svg>
