name: Desktop CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Check, Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev mpv ffmpeg libsqlite3-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libpulse-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Clippy linting
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --manifest-path desktop/Cargo.toml

  build-linux:
    name: Build Linux Packages (.deb & AppImage)
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libsqlite3-dev libssl-dev libxkbcommon-dev \
            libfontconfig1-dev libgl1-mesa-dev libx11-dev libasound2-dev dpkg-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux release binary
        run: |
          cargo build --manifest-path desktop/Cargo.toml --release
          mkdir -p bin
          cp desktop/target/release/adult-hub-desktop bin/
          chmod +x bin/adult-hub-desktop

      - name: Package Debian / Ubuntu .deb
        run: ./scripts/package-deb.sh

      - name: Package Linux AppImage
        run: ./scripts/package-appimage.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.AppImage
            bin/adult-hub-desktop

  build-windows:
    name: Build Windows Packages (ZIP & NSIS Installer)
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 nsis p7zip-full zip curl

      - name: Setup Rust toolchain for Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows release binary and ZIP
        run: ./scripts/package-windows.sh

      - name: Compile Windows NSIS Installer
        run: ./scripts/package-windows-installer.sh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            bin/adult-hub-desktop.exe
            bin/adult-hub-desktop-windows-x64.zip
            bin/adult-hub-desktop-setup.exe

  release:
    name: Publish Release & Manifest
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-linux, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin-artifacts

      - name: Consolidate packages into bin/
        run: |
          mkdir -p bin
          find bin-artifacts -type f -exec cp {} bin/ \;
          ls -la bin/

      - name: Generate & Sign Manifest
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/desktop-v}"
          if [[ -n "${RELEASE_KEY}" ]]; then
            mkdir -p dev
            echo "${RELEASE_KEY}" > dev/release-signing-key.pem
            chmod 600 dev/release-signing-key.pem
          fi
          ./scripts/sign-release.sh "${TAG_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/adult-hub-desktop-setup.exe
            bin/adult-hub-desktop-windows-x64.zip
            bin/adult-hub-desktop_*.deb
            bin/Adult_Hub_Desktop-*.AppImage
            bin/adult-hub-desktop
            bin/adult-hub-desktop.exe
            bin/adult-hub-update-manifest.json
            bin/adult-hub-update-manifest.json.sig
          draft: false
          prerelease: false
          generate_release_notes: true
