name: Desktop CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint-and-test:
    name: Check, Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev mpv ffmpeg libsqlite3-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libpulse-dev \
            appstream

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop -> desktop/target"

      - name: Check code formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net desktop/assets/io.github.backwaterxxx.adulthubdesktop.appdata.xml

      - name: Clippy linting
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # Advisory on branch/PR builds; release tags fail on unaddressed advisories.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo audit --file desktop/Cargo.lock

  build-linux:
    name: Build Linux Packages (.deb & AppImage)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libsqlite3-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libpulse-dev dpkg-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop -> desktop/target"

      - name: Build Linux release binary
        run: |
          cargo build --locked --manifest-path desktop/Cargo.toml --release
          mkdir -p bin
          cp desktop/target/release/adult-hub-desktop bin/
          chmod +x bin/adult-hub-desktop

      - name: Package Debian / Ubuntu .deb
        run: ./scripts/package-deb.sh

      - name: Package Linux AppImage
        run: ./scripts/package-appimage.sh

      - name: Smoke-check Linux packages
        run: |
          dpkg-deb --info bin/adult-hub-desktop_*.deb
          dpkg-deb --contents bin/adult-hub-desktop_*.deb | grep -q 'usr/bin/adult-hub-desktop'
          test -x bin/Adult_Hub_Desktop-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.AppImage
            bin/adult-hub-desktop

  build-windows:
    name: Build Windows EXE and Runtime DLL
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MinGW and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 p7zip-full curl

      - name: Setup Rust toolchain for Windows target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop -> desktop/target"

      - name: Build Windows release files
        run: ./scripts/package-windows.sh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          path: |
            bin/adult-hub-desktop.exe
            bin/libmpv-2.dll

  release:
    name: Publish Release & Manifest
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-linux, build-windows, dependency-audit]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: bin-artifacts

      - name: Consolidate packages into bin/
        run: |
          mkdir -p bin
          find bin-artifacts -type f -exec cp {} bin/ \;
          ls -la bin/

      - name: Validate Release Version
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/desktop-v}"
          CARGO_VER=$(python3 -c "import tomllib; print(tomllib.load(open('desktop/Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "Tag version: ${TAG_VER}, Cargo.toml version: ${CARGO_VER}"
          if [[ "${TAG_VER}" != "${CARGO_VER}" ]]; then
            echo "::error::Tag version '${TAG_VER}' does not match desktop/Cargo.toml version '${CARGO_VER}'"
            exit 1
          fi

      - name: Generate & Sign Manifest
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/desktop-v}"
          if [[ -z "${RELEASE_KEY}" ]]; then
            echo "::error::Repository secret RELEASE_SIGNING_KEY is not set; the release manifest cannot be signed."
            exit 1
          fi
          mkdir -p dev
          echo "${RELEASE_KEY}" > dev/release-signing-key.pem
          chmod 600 dev/release-signing-key.pem
          ./scripts/sign-release.sh "${TAG_NAME}"

      - name: Remove signing key from runner
        if: always()
        run: rm -f dev/release-signing-key.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            bin/adult-hub-desktop_*.deb
            bin/Adult_Hub_Desktop-*.AppImage
            bin/adult-hub-desktop
            bin/adult-hub-desktop.exe
            bin/libmpv-2.dll
            bin/adult-hub-update-manifest.json
            bin/adult-hub-update-manifest.json.sig
          draft: false
          prerelease: false
          generate_release_notes: true

  verify-release-channel:
    name: Verify Update Channel
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release job can succeed while the channel stays broken: a bad
      # signature, a manifest that is never served, or an asset URL that 404s.
      # Clients then report "no updates" and nothing fails in CI.
      - name: Download the manifest clients actually fetch
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/desktop-v}"
          DIRECT="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}"
          LATEST="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          mkdir -p bin
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 30 "${DIRECT}/adult-hub-update-manifest.json" -o bin/adult-hub-update-manifest.json \
               && curl -fsSL --max-time 30 "${DIRECT}/adult-hub-update-manifest.json.sig" -o bin/adult-hub-update-manifest.json.sig; then
              echo "manifest downloaded on attempt ${attempt}"
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "::error::could not download the manifest for desktop-v${VERSION}"
              exit 1
            fi
            sleep 10
          done
          curl -fsSL --max-time 30 -o /dev/null "${LATEST}/adult-hub-update-manifest.json" \
            || { echo "::error::releases/latest/download does not serve the manifest"; exit 1; }

      - name: Verify the manifest against the embedded key
        env:
          ADULT_HUB_REQUIRE_REAL_MANIFEST: "1"
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml \
            --package adult-hub-desktop --bin adult-hub-desktop \
            test_verify_real_generated_manifest_against_embedded_key -- --nocapture

      - name: Verify the published version and every asset URL
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          version = os.environ["GITHUB_REF"].removeprefix("refs/tags/desktop-v")
          manifest = json.load(open("bin/adult-hub-update-manifest.json"))
          if manifest["version"] != version:
              raise SystemExit(f"manifest version {manifest['version']} != tag {version}")

          assets = []
          for package in manifest["packages"]:
              assets.append((package["package_type"], package["url"]))
              if package.get("runtime_dll"):
                  assets.append(("runtime-dll", package["runtime_dll"]["url"]))

          for kind, url in assets:
              request = urllib.request.Request(url, method="HEAD")
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(f"{kind}: {response.status} {url}")
          print(f"channel healthy for {version}")
          PY
