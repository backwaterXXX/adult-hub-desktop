# Cargo configuration for Adult Hub Desktop repository root.
# Matches desktop/.cargo/config.toml so commands run from either /work or /work/desktop share settings.


[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]
